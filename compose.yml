# 로컬 개발용 PostgreSQL.
#
# ⚠️ **포트가 5432 가 아니다.** 같은 머신의 다른 프로젝트(commerce)가 5432·5433 을
# 쓰고 있어 5434 로 띄운다. `.env` 의 DATABASE_URL 포트를 여기와 맞춰야 한다.
#
#   pnpm db:up      컨테이너 기동 (healthy 까지 대기)
#   pnpm db:down    정지 (데이터 보존)
#   pnpm db:reset   정지 + 볼륨 삭제 (데이터 전부 삭제)
#
# 프로덕션 설정이 아니다. 비밀번호가 평문인 것은 로컬 전용이기 때문이다.

name: my-heritage

services:
  postgres:
    image: postgres:16-alpine
    container_name: my-heritage-postgres
    restart: unless-stopped
    ports:
      # 호스트 5434 → 컨테이너 5432
      - "5434:5432"
    environment:
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage
      POSTGRES_DB: my_heritage
      # 한국어·일본어 정렬을 위해 UTF-8 을 명시한다
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # prisma migrate 를 바로 이어 돌리므로 준비 상태를 정확히 봐야 한다
      test: ["CMD-SHELL", "pg_isready -U heritage -d my_heritage"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
    name: my-heritage-pgdata
